services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: showgather
      POSTGRES_DB: showgather
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and choose a local PostgreSQL password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showgather -d showgather"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  stream:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.stream
    ports:
      - "8080:8080"
    volumes:
      - hls-data:/hls
    healthcheck:
      test: ["CMD", "test", "-f", "/hls/stream.m3u8"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  hls-server:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.hls
    ports:
      - "8000:80"
    volumes:
      - hls-data:/data/hls:ro
    depends_on:
      stream:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.api
    ports:
      - "3001:3001"
    environment:
      ID3_INJECTOR_HOST: stream
      ID3_INJECTOR_PORT: "8080"
      DATABASE_URL: postgresql://showgather:${POSTGRES_PASSWORD}@postgres:5432/showgather?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      stream:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  admin:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.admin
    ports:
      - "3002:3002"
    environment:
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  player:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.player
      args:
        VITE_HLS_URL: ${VITE_HLS_URL:-http://127.0.0.1:8000/hls/stream.m3u8}
    ports:
      - "3003:3003"
    environment:
      API_URL: http://api:3001
      VITE_HLS_URL: ${VITE_HLS_URL:-http://127.0.0.1:8000/hls/stream.m3u8}
    depends_on:
      api:
        condition: service_healthy
      hls-server:
        condition: service_started
    restart: unless-stopped

volumes:
  hls-data:
  postgres-data:
