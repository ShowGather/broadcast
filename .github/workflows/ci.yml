name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter @showgather/event-schema test
      - run: pnpm --filter @showgather/presentation-model test
      - run: pnpm --filter @showgather/api test
      - run: pnpm --filter @showgather/player test

  segmenter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ts-segmenter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go test ./...
